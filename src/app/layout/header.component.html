<nav class="navbar navbar-light">
  <div class="container">
    <a class="navbar-brand" routerLink="/">{{ appName | lowercase }}</a>

    <!-- Show this for logged out users -->
    <ul *appShowAuthed="false" class="nav navbar-nav pull-xs-right">
      <li class="nav-item">
        <a
          class="nav-link"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: true }"
          routerLink="/"
        >
          Home
        </a>
      </li>

      <li class="nav-item">
        <a class="nav-link" routerLinkActive="active" routerLink="/login">Sign in</a>
      </li>

      <li class="nav-item">
        <a class="nav-link" routerLinkActive="active" routerLink="/register">Sign up</a>
      </li>
    </ul>

    <!-- Show this for logged in users -->
    <ul *appShowAuthed="true" class="nav navbar-nav pull-xs-right">
      <li class="nav-item">
        <a
          class="nav-link"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: true }"
          routerLink="/"
        >
          Home
        </a>
      </li>

      <li class="nav-item">
        <a class="nav-link" routerLinkActive="active" routerLink="/editor">
          <i class="ion-compose"></i>&nbsp;New Article
        </a>
      </li>

      <li class="nav-item">
        <a class="nav-link" routerLinkActive="active" routerLink="/settings">
          <i class="ion-gear-a"></i>&nbsp;Settings
        </a>
      </li>

      @if (currentUser(); as user) {
        <li class="nav-item">
          <a class="nav-link" routerLinkActive="active" [routerLink]="['/@' + user.username]">
            <img [src]="user.image ?? ''" class="user-pic" />
            {{ user.username }}
          </a>
        </li>
      }
    </ul>
  </div>
</nav>
